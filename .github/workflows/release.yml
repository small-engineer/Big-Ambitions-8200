name: Verify GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify source and locales
        run: python3 -B scripts/verify.py

      - name: Download and verify release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern Unit-8200.zip --dir "$RUNNER_TEMP"
          python3 -B scripts/release_archive.py extract \
            "$RUNNER_TEMP/Unit-8200.zip" \
            "$RUNNER_TEMP/workshop-content"
